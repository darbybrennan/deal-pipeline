[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the PM app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
